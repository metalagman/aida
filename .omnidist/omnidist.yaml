profiles:
  aida:
    tool:
      name: aida
      main: ./cmd/aida
    readme-path: ./README.md
    version:
      source: git-tag
    targets:
      - os: darwin
        arch: amd64
      - os: darwin
        arch: arm64
      - os: linux
        arch: amd64
      - os: linux
        arch: arm64
      - os: windows
        arch: amd64
    build:
      ldflags: -s -w
      tags: []
      cgo: false
    distributions:
      npm:
        package: "@metalagman/aida"
        registry: https://registry.npmjs.org
        access: public
        include-readme: true
        keywords:
          - ai
          - llm
          - shell
          - cli
          - terminal
          - acp
